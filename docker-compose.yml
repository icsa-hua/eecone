version: "1.0"

services:
    rto_ui:
        tty: true
        image: rto_v2:latest
        container_name: rto_ui_rm3
        restart: always
        entrypoint: /bin/bash
        command: -c "streamlit run main.py"
        environment:
            - PYTHONPATH=/app
            - debug_mode=false
            - TZ=Europe/Athens
        volumes:
            - "D:/RTO/app:/app"
        working_dir: "/app/rtx_ui"
        ports:
            - "12460:8501"
        deploy:
            resources:
                limits:
                    memory: 1g